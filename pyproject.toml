[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilrai-ai-solutions-assessment"
version = "1.0.0"
description = "QuilrAI AI Field Developer / Solutions Engineer assessment submission"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
